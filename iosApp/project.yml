# Project Xcode được sinh bằng XcodeGen (https://github.com/yonaskolb/XcodeGen) để không phải
# commit file .xcodeproj. Trên máy Mac:  brew install xcodegen && cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.example.damthoai
  deploymentTarget:
    iOS: "16.0"   # PushToTalk cần iOS 16 (iPhone 8 trở lên)
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: WebRTC
      - sdk: PushToTalk.framework
      - sdk: MediaPlayer.framework
      - sdk: AVFoundation.framework
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.developer.push-to-talk: true
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Đàm Thoại
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose Multiplatform: cho phép 120Hz trên iPhone ProMotion
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Đàm Thoại cần micro để bạn nói qua bộ đàm.
        NSCameraUsageDescription: Đàm Thoại cần camera để quét mã QR vào kênh và nháy đèn flash khi có cảnh báo khẩn cấp.
        NSLocalNetworkUsageDescription: Đàm Thoại tìm máy chủ bộ đàm trong mạng Wi-Fi nội bộ.
        NSBonjourServices: [_bodam._tcp]
        UIBackgroundModes: [audio, voip, push-to-talk]
        NSAppTransportSecurity:
          # Máy chủ trong LAN dùng ws:// (không mã hoá), giống bản Android
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.damthoai.ios
        PRODUCT_NAME: DamThoai
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Framework Kotlin "Shared" do Gradle build trong bước preBuildScripts bên dưới
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
    preBuildScripts:
      - name: Build Kotlin framework (Shared)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Bỏ qua build Kotlin trong lúc Xcode index"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
