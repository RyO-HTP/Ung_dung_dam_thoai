# Đưa cả máy chủ Signaling Python (TV1) và Backend Go (TV5) lên Render để gọi được qua 4G / khác mạng.
# Cách deploy 1-click:
#   Mở https://dashboard.render.com/blueprint/new?repo=https://github.com/RyO-HTP/Ung_dung_dam_thoai
#   -> Bấm Apply (có thể điền TURN_USERNAME / TURN_CREDENTIAL nếu có, hoặc để trống dùng TURN dự phòng OpenRelay).
#   -> SIGNALING_URL và SIGNALING_TOKEN của damthoai-backend được tự động lấy sang từ damthoai-signaling!
services:
  - type: web
    name: damthoai-signaling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python signaling_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SIGNALING_TOKEN
        generateValue: true
      - key: TURN_USERNAME
        value: ""
      - key: TURN_CREDENTIAL
        value: ""

  - type: web
    name: damthoai-backend
    runtime: go
    plan: free
    rootDir: backend-tv5
    buildCommand: go build -tags netgo -ldflags "-s -w" -o damthoai-backend .
    startCommand: ./damthoai-backend
    healthCheckPath: /healthz
    envVars:
      - key: SIGNALING_URL
        fromService:
          type: web
          name: damthoai-signaling
          property: host
      - key: SIGNALING_TOKEN
        fromService:
          type: web
          name: damthoai-signaling
          envVarKey: SIGNALING_TOKEN
      - key: DEMO_MODE
        value: "false"
