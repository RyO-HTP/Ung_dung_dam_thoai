name: backend-test
on:
  push:
    branches: [ "**" ]
  pull_request:
jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tv5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -count=1
