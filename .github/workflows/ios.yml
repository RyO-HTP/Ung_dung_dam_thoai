# Build kiểm tra bản iOS trên máy macOS của GitHub (nhóm không có Mac).
# Kết quả: test Kotlin chạy trên iOS Simulator + file DamThoai.app (Simulator, chưa ký) để tải về.
name: iOS build

on:
  push:
    branches: [ios-kmp, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Xcode đang dùng
        run: xcodebuild -version

      # Test lỗi KHÔNG chặn việc build app (để vẫn có .ipa cài thử); job sẽ báo đỏ ở bước cuối.
      - name: Test Kotlin dùng chung trên iOS Simulator
        id: kotlin_tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test --stacktrace 2>&1 | tee gradle-test.log

      # Annotation xem được công khai qua API (log job thì cần đăng nhập).
      - name: Hiện lỗi test dưới dạng annotation
        if: steps.kotlin_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          def esc(s): return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          n = 0
          for f in glob.glob('shared/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                      if n >= 8: break
                      body = (fail.get('message') or '') + '\n' + (fail.text or '')[:1500]
                      print(f"::error title=TEST {tc.get('classname')}.{tc.get('name')}::{esc(body)}")
                      n += 1
          log = open('gradle-test.log', errors='replace').read().splitlines()
          keep = [l for i, l in enumerate(log) if re.match(r'^(e: |> Task .*FAILED|\* What went wrong|Caused by)', l)
                  or (i > 0 and log[i-1].startswith('* What went wrong'))]
          print(f"::error title=Gradle ({len(keep)} dong)::{esc(chr(10).join(keep[:60]))}")
          print(f"::error title=Gradle log cuoi::{esc(chr(10).join(log[-60:]))}")
          PY

      - name: Sinh project Xcode bằng XcodeGen
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build app iOS (Simulator, không ký)
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Tải lên DamThoai.app (Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: DamThoai-ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/DamThoai.app
          if-no-files-found: error

      # Bản cho iPhone thật, CHƯA KÝ: tải về rồi ký + cài bằng Sideloadly (Windows) với Apple ID.
      # Bỏ entitlement PushToTalk vì Apple ID miễn phí không được cấp quyền này.
      - name: Build bản iPhone thật (chưa ký) và đóng gói .ipa
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/DamThoai.app ipa/Payload/
          cd ipa && zip -qry ../DamThoai-unsigned.ipa Payload

      - name: Tải lên DamThoai-unsigned.ipa (iPhone thật)
        uses: actions/upload-artifact@v4
        with:
          name: DamThoai-iphone-unsigned-ipa
          path: iosApp/DamThoai-unsigned.ipa
          if-no-files-found: error

      - name: Báo cáo test khi lỗi
        if: always() && steps.kotlin_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: |
            shared/build/reports/tests
            gradle-test.log
          if-no-files-found: ignore

      - name: Đánh dấu job lỗi vì test Kotlin
        if: steps.kotlin_tests.outcome == 'failure'
        run: |
          echo "::error::Test Kotlin trên iOS Simulator lỗi (xem annotation phía trên). App vẫn được build để cài thử."
          exit 1
