# Build kiểm tra bản iOS trên máy macOS của GitHub (nhóm không có Mac).
# Kết quả: test Kotlin chạy trên iOS Simulator + file DamThoai.app (Simulator, chưa ký) để tải về.
name: iOS build

on:
  push:
    branches: [ios-kmp, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Xcode đang dùng
        run: xcodebuild -version

      - name: Test Kotlin dùng chung trên iOS Simulator
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Sinh project Xcode bằng XcodeGen
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build app iOS (Simulator, không ký)
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Tải lên DamThoai.app (Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: DamThoai-ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/DamThoai.app
          if-no-files-found: error

      - name: Báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests
          if-no-files-found: ignore
