org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Địa chỉ Backend Go mặc định khi build.
# Lưu ý: https://damthoai-backend.onrender.com hiện thường trả 404 (free tier tắt / chưa deploy).
# Khi test local: chạy backend-tv5 (./backend-tv5/run_local.sh) rồi trong app vào Cài đặt
# đổi URL thành http://<IP-máy-tính>:8080  (điện thoại cùng Wi‑Fi).
# Hoặc build với: ./gradlew :app:assembleDebug -PBACKEND_BASE_URL=http://192.168.1.10:8080
BACKEND_BASE_URL=https://damthoai-backend.onrender.com
